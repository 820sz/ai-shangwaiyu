name: readflow
description: "AI英语阅读学习助手 - 拍照取词、生词归档、AI文章生成、回译练习"
publish_to: 'none'
version: 2.1.0+55

environment:
  # 下限跟本机 Flutter stable SDK 走(审查 P2-23 顺手补约束说明);
  # 升级前先 flutter --version 核对,CI(.github/workflows/ci.yml)固定同一条 channel。
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 核心依赖
  provider: ^6.1.2
  dio: ^5.7.0
  path: ^1.9.0
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.69.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  table_calendar: ^3.1.3
  # v1.9.0 审查 P2-23:删除 permission_handler(全库零调用,白带原生库与注册代码)。
  # 本项目权限只有 INTERNET/ACCESS_NETWORK_STATE/REQUEST_INSTALL_PACKAGES,
  # 都由系统在首次使用时处理;将来真需要运行时权限(相机/通知)再引入。
  # 图片处理
  image: ^4.5.3
  image_cropper: ^12.0.0
  # 唯一ID
  uuid: ^4.5.1
  # 自动更新
  package_info_plus: ^8.0.0
  flutter_markdown: ^0.7.7+1
  # 系统 TTS 发音(离线可用,v1.5.0 词汇发音)
  flutter_tts: ^4.2.0
  # 更新包 sha256 完整性校验(v1.9.0;原为传递依赖,这里显式声明)
  crypto: ^3.0.6
  # v2.2 听力:播客/TED 音频播放与听写(用户已确认引入音频播放依赖)
  just_audio: ^0.9.42
  # 音频会话(语音内容而非音乐):接电话/其它 App 播放时正确让路。
  # just_audio 的传递依赖,这里显式声明 —— 与 crypto 同理,依赖被直接 import。
  audio_session: ^0.1.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # v2.0:在纯 Dart 测试里跑真实 SQLite,用来验证数据库迁移 ——
  # 迁移是"一旦错就不可自愈"的代码(审查 P0-2),必须能在提交前拦住。
  # 仅测试依赖,不进 APK。
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    # v2.0:词频表(难度分析/词汇量测试的地基,离线可算、零 API 成本)
    - assets/data/
