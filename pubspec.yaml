name: readflow
description: "AI英语阅读学习助手 - 拍照取词、生词归档、AI文章生成、回译练习"
publish_to: 'none'
version: 1.2.7+17

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 核心依赖
  provider: ^6.1.2
  dio: ^5.7.0
  path: ^1.9.0
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.69.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  table_calendar: ^3.1.3
  permission_handler: ^11.3.1
  # 图片处理
  image: ^4.5.3
  image_cropper: ^12.0.0
  # 唯一ID
  uuid: ^4.5.1
  # 自动更新
  package_info_plus: ^8.0.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
